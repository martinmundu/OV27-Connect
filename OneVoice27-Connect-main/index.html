    <script>
      // Suppress Vite dev server HMR WebSocket errors in AI Studio iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason &&
          (String(event.reason).includes('WebSocket') ||
           String(event.reason?.message).includes('WebSocket') ||
           String(event.reason?.message).includes('closed without opened'))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') ||
           event.message.includes('closed without opened'))
        ) {
          event.preventDefault();
        }
      });
    </script>
